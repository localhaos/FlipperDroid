name: FlipperDroid AIO Build (z Shizuku)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flipperdroid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Android APK Build (Standard + Shizuku)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_OPTS: >
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configuration-cache=true
        -Dorg.gradle.vfs.watch=false
        -Dorg.gradle.console=plain
        -Dfile.encoding=UTF-8
        -Dkotlin.incremental=false
        -Dorg.gradle.logging.level=info
        -Dorg.gradle.warning.mode=all
        -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC"

    steps:
      - name: Harden Runner
        run: |
          set -euxo pipefail
          echo "Runner hardening complete."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK Components
        run: |
          set -euxo pipefail
          COMPONENTS=(
            "platform-tools"
            "platforms;android-35"
            "build-tools;35.0.0"
          )
          for component in "${COMPONENTS[@]}"; do
            for attempt in 1 2 3; do
              sdkmanager "$component" && break
              echo "Retry $attempt failed for $component"
              sleep 15
            done
          done

      - name: Verify Repository Structure
        run: |
          set -euxo pipefail
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Generate Build Metadata
        run: |
          set -euxo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          SAFE_BRANCH=$(echo "${BRANCH}" | tr '/' '-')
          BUILD_DATE=$(date -u +"%Y%m%d-%H%M%S")
          ENV_NAME="internal-${SAFE_BRANCH}-${SHORT_SHA}"
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Print Runner Diagnostics
        run: |
          set -euxo pipefail
          uname -a
          echo "==== CPU ===="
          nproc
          echo "==== MEMORY ===="
          free -h
          echo "==== STORAGE ===="
          df -h
          echo "==== JAVA ===="
          java -version
          echo "==== GRADLE ===="
          ./gradlew --version

      - name: Discover Gradle Assemble Task
        run: |
          set -euxo pipefail
          ./gradlew tasks --all --no-daemon > gradle_tasks.txt
          TASK=""
          PRIORITY_TASKS=(
            ":instances:android:app:assembleInternal"
            ":instances:android:app:assembleDebug"
            "assembleInternal"
            "assembleDebug"
          )
          for candidate in "${PRIORITY_TASKS[@]}"; do
            if grep -q "$candidate" gradle_tasks.txt; then
              TASK="$candidate"
              break
            fi
          done
          if [[ -z "$TASK" ]]; then
            echo "No suitable assemble task found"
            exit 1
          fi
          echo "TASK=${TASK}" >> $GITHUB_ENV

      - name: Warm Gradle Dependencies
        run: |
          set +e
          ./gradlew dependencies --no-daemon --stacktrace || true

      - name: Build Standard APK
        run: |
          set -euxo pipefail
          ./gradlew \
            "${TASK}" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --build-cache \
            -Dorg.gradle.project.env_name="${ENV_NAME}" \
            -Dorg.gradle.project.build_date="${BUILD_DATE}" \
            -Dorg.gradle.project.is_google_feature=true \
            -Dorg.gradle.project.is_metric_enabled=true \
            -Dorg.gradle.project.source_install=github \
            -Dorg.gradle.project.current_flavor_type=PROD

      - name: Build Shizuku APK
        run: |
          set -euxo pipefail
          ./gradlew \
            assembleShizukuVersionDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --build-cache \
            -Dorg.gradle.project.env_name="${ENV_NAME}" \
            -Dorg.gradle.project.build_date="${BUILD_DATE}" \
            -Dorg.gradle.project.is_google_feature=true \
            -Dorg.gradle.project.is_metric_enabled=true \
            -Dorg.gradle.project.source_install=github

      - name: Generate Artifact Manifest
        if: always()
        run: |
          set -euxo pipefail
          {
            echo "Build Environment"
            echo "================="
            echo "ENV_NAME=${ENV_NAME}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "BRANCH=${GITHUB_REF_NAME}"
            echo
            echo "Artifacts"
            echo "========="
            find . \( -name "*.apk" -o -name "*.aab" \)
          } > artifact_manifest.txt
          cat artifact_manifest.txt

      - name: Generate SHA256 Checksums
        if: always()
        run: |
          set -euxo pipefail
          find . \( -name "*.apk" -o -name "*.aab" \) -exec sha256sum {} \; > checksums.txt || true
          cat checksums.txt || true

      - name: Upload APK/AAB Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlipperDroid-${{ env.ENV_NAME }}
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
            artifact_manifest.txt
            checksums.txt

      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics-${{ env.ENV_NAME }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
            **/*.hprof
            **/*.log
            gradle_tasks.txt

      - name: Cleanup Gradle State
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf ~/.gradle/daemon || true
          rm -rf ~/.gradle/native || true
